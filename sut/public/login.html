<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Lending Portal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <main class="shell narrow">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Synthetic Fintech Platform</p>
      <h1 id="page-title">Digital Lending Portal</h1>
      <p>Secure workspace for loan operations.</p>
      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <p id="login-alert" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
